# =====================================================================
#  Bengol Spices - separate addresses for the office panels
#  /etc/nginx/sites-available/panels.bengolspices.com.conf
#
#    https://admin.bengolspices.com     opens on the admin login
#    https://employee.bengolspices.com  opens on the employee login
#
#  They serve the same website files as www.bengolspices.com (one app,
#  one build), so a deploy of the website updates all three. Each address
#  answers only for its own panel (/admin/... or /employee/...); anything
#  else is sent to its login. The public site and the other panels stay on
#  www. The old addresses (www.bengolspices.com/admin/login and
#  /employee/login) are untouched and keep working.
#
#  The API must list these two origins in FRONTEND_URL (deploy/backend.env)
#  or the login pages open but cannot sign in.
#
#  Certificates: one per name, issued by certbot with the webroot method
#  (the port 80 blocks below serve /.well-known/acme-challenge from
#  /var/www/letsencrypt, which is also how they renew):
#
#    certbot certonly --webroot -w /var/www/letsencrypt -d admin.bengolspices.com
#    certbot certonly --webroot -w /var/www/letsencrypt -d employee.bengolspices.com
#
#  Install or update with:   ./deploy/push.sh nginx
# =====================================================================

# --- plain HTTP: certificate checks, then on to HTTPS -------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.bengolspices.com employee.bengolspices.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================================
#  ADMIN
# =====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.bengolspices.com;

    ssl_certificate     /etc/letsencrypt/live/admin.bengolspices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bengolspices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/Bengol-Spices-V2/FrontEnd/dist;
    index index.html;

    server_tokens off;

    access_log /var/log/nginx/bengolspices-admin.access.log;
    error_log  /var/log/nginx/bengolspices-admin.error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml application/xml+rss
        application/manifest+json image/svg+xml font/woff font/woff2;

    # Build output: the file name carries a hash, so it can be kept for ever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Images and fonts the panel uses
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Not for search engines
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The address itself goes to the login
    location = / {
        add_header Cache-Control "no-store" always;
        return 302 /admin/login;
    }

    # The panel. The shell is empty (React draws it), never stored: these
    # screens show business data.
    location ~ ^/admin(/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Expires "0" always;
        try_files /app.html /index.html =404;
    }

    # Anything else belongs to the public site, not here
    location / {
        add_header Cache-Control "no-store" always;
        return 302 /admin/login;
    }
}

