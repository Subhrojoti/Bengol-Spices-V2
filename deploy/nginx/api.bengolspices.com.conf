# =====================================================================
#  Bengol Spices - API
#  /etc/nginx/sites-enabled/api.bengolspices.com.conf
#
#  Proxies to the Express app that PM2 runs on 127.0.0.1:8000.
#
#  Install or update with:   ./deploy/push.sh nginx
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.bengolspices.com;
    return 301 https://api.bengolspices.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bengolspices.com;

    ssl_certificate     /etc/letsencrypt/live/api.bengolspices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bengolspices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # do not advertise the nginx version
    server_tokens off;

    access_log /var/log/nginx/bengolspices-api.access.log;
    error_log  /var/log/nginx/bengolspices-api.error.log;

    # The API answers in JSON, and lists of orders, stores and products
    # shrink to a fraction of their size. That matters most to the agent
    # app on mobile data. Only JSON and plain text are compressed: the
    # live order feed (text/event-stream) is left alone, because a
    # compressor would hold events back until it had enough to squeeze.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain;

    # Product images and other uploads pass through multer on the way to
    # Cloudinary. nginx's 1M default rejected them before Express saw them.
    client_max_body_size 25M;

    # Invoice PDF generation and the courier calls are slower than the
    # 60 second default, and a timeout there surfaces as a 504 with no
    # explanation in the app.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 30s;

    location / {
        # 127.0.0.1 rather than localhost. localhost resolves to ::1 first
        # on this box, the app listens on IPv4, and every request paid for
        # a failed IPv6 attempt before falling back. The connection refused
        # errors in the log were all that.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Passed through as it arrives. The admin panel's live order feed
        # is one long response; buffered, nothing would reach the browser.
        # The app sends a keep-alive line every 25 seconds, well inside
        # the read timeout above.
        proxy_buffering off;

        add_header Strict-Transport-Security "max-age=15552000" always;
    }
}
