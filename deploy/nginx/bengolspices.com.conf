# =====================================================================
#  Bengol Spices - public website
#  /etc/nginx/sites-available/bengolspices.com.conf
#
#  Install or update with:   ./deploy/push.sh nginx
#  (backs up the live file, tests the new one, reloads, checks the site
#  still answers, and puts the old file back if anything is wrong)
#
#  The TLS lines point at the certbot certificate that already covers
#  bengolspices.com and www.bengolspices.com. Keep them as they are, or
#  run: certbot --nginx -d bengolspices.com -d www.bengolspices.com
# =====================================================================

# --- plain HTTP: send everything to the canonical HTTPS name ----------
server {
    listen 80;
    listen [::]:80;
    server_name bengolspices.com www.bengolspices.com;
    return 301 https://www.bengolspices.com$request_uri;
}

# --- HTTPS on the bare domain: redirect to www ------------------------
#
# Both names used to serve the site directly. The API only trusts the
# www. origin, so a visitor who arrived at the bare domain got a page
# that rendered and then loaded nothing: no products, no login, and no
# message explaining why. One canonical name, and it cannot come back.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bengolspices.com;

    ssl_certificate     /etc/letsencrypt/live/bengolspices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bengolspices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.bengolspices.com$request_uri;
}

# --- the site ---------------------------------------------------------
server {
    # http2: the home page is about twenty small files. Over HTTP/1.1 a
    # browser fetches them six at a time; over HTTP/2 they share one
    # connection and arrive together.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bengolspices.com;

    ssl_certificate     /etc/letsencrypt/live/bengolspices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bengolspices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/Bengol-Spices-V2/FrontEnd/dist;
    index index.html;

    # do not advertise the nginx version
    server_tokens off;

    access_log /var/log/nginx/bengolspices.access.log;
    error_log  /var/log/nginx/bengolspices.error.log;

    gzip on;
    gzip_vary on;
    # nginx's default is level 1. Level 5 makes the main script about a
    # tenth smaller for a cost in server time too small to measure here.
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml application/xml+rss
        application/manifest+json image/svg+xml font/woff font/woff2;

    # One address per page, so search engines do not count any of them
    # twice: /home was a second address for the home page, and /about/
    # is the same page as /about.
    rewrite ^/home/?$ / permanent;
    rewrite ^/(.+)/$ /$1 permanent;

    # An address that does not exist answers 404, with the site's own
    # "page not found" screen as the body (see "everything else" below).
    error_page 404 /404.html;

    # ------------------------------------------------------------------
    #  Files
    # ------------------------------------------------------------------

    # Build output. Filenames carry a content hash, so a changed file is
    # always a new name and these can be cached indefinitely.
    #
    # ^~ matters. As a plain prefix this loses to the media regex below,
    # and every PNG in the build picks up the short rule instead.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # Static media that is not content-hashed
    location ~* \.(mp4|webm|ogg|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # nginx does not know this extension and would send it as a download
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    #  Pages
    #
    #  The build writes one HTML file per public page, already filled in
    #  (FrontEnd/scripts/prerender.mjs), so search engines and link
    #  previews read real content instead of an empty <div>:
    #
    #    /                 index.html     home
    #    /about            about.html     and careers, help, terms, privacy
    #    /agent-onboarding <name>.html    and /delivery-partner-register:
    #                                     the application forms (real
    #                                     title and share tags, empty body)
    #    /admin, logins    app.html       an empty shell; React draws it
    #    anything else     404.html       with a 404 status
    #
    #  Every one of them loads the same app, so a link the server does
    #  not recognise still works; it only gets the wrong status code.
    #
    #  A build made before pre-rendering has only index.html. Each rule
    #  below falls back to it, so this file is safe to install before or
    #  after the new website is uploaded.
    #
    #  HTML is never used without checking for a newer copy: it names the
    #  current build's script files, and a stale copy is how visitors
    #  once kept getting the previous version of the site after a deploy.
    # ------------------------------------------------------------------

    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files /index.html =404;
    }

    # The HTML shell, when asked for by name.
    #
    # This was once served with no Cache-Control at all, only
    # Last-Modified and an ETag. With no explicit instruction a browser
    # decides for itself how long the file stays fresh, and it decides
    # generously. Visitors kept loading a cached index.html that still
    # named the previous build's scripts.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Logins and panels. Nothing here is content, so the shell is empty
    # and tells search engines not to index it. It is also never stored:
    # these screens show business data.
    location ~ ^/(admin|employee|delivery|agent|marketing)(/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Expires "0" always;
        try_files /app.html /index.html =404;
    }

    # Set-password and reset-password screens: the same shell. The links
    # carry a one-time token, so these are not stored.
    #
    # The two application forms (/agent-onboarding and
    # /delivery-partner-register) are NOT listed here. They are public
    # pages with a file of their own, found by the last rule below.
    location ~ ^/(agent-set-password|agent-forgot-password|agent-reset-password|delivery-forgot-password|delivery-reset-password|error)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Expires "0" always;
        try_files /app.html /index.html =404;
    }

    # The "page not found" screen. Only reachable through error_page.
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Everything else: a real file (robots.txt, sitemap.xml), a public
    # page ($uri.html), or nothing.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri $uri.html @unknown;
    }

    location @unknown {
        # A build made before pre-rendering has no 404.html, and in it
        # /about is not a file either. Serve the app as before rather
        # than answer "not found" for pages that exist.
        if (!-f $document_root/404.html) {
            rewrite ^ /index.html last;
        }

        return 404;
    }
}
