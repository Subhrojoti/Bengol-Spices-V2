    <meta name="theme-color" content="#14100c" />

    <!-- Dark mode, decided before anything is drawn.

         Someone who chose the dark theme in a panel would otherwise see a
         white screen for the moment between the page arriving and the app
         starting. This marks the page dark straight away, and the
         stylesheet colours the background from that.

         Only on the panels' own addresses: the public website and the
         sign-in screens have one look and are never repainted. The same
         rule and the same storage key are in src/theme/ThemeMode.jsx. -->
    <script>
      (function () {
        try {
          var path = location.pathname;
          var panel =
            /^\/(admin|employee|delivery|marketing)(\/|$)|^\/agent\/profile-settings(\/|$)/.test(path) &&
            !/\/login\/?$/.test(path);

          if (panel && localStorage.getItem("bengol:theme") === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* storage blocked: the panel opens in the light theme */
        }
      })();
    </script>

    <!-- The icon used to be the 2.9 MB master logo, downloaded on every
         page. These are the same emblem at the sizes browsers ask for. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The app asked for Inter in its MUI theme but never loaded it, so every
         screen fell back to Helvetica/Arial.

         Loaded without blocking the first paint: the stylesheet is fetched
         as "print", which the browser does at low priority, then switched to
         apply everywhere once it has arrived. Text shows in the fallback
         font meanwhile (display=swap) instead of the page waiting on
         Google's servers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
